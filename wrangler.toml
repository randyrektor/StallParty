# stall.party — static app + live watch rooms (Durable Objects).
# Deploy: npm run deploy   (after wrangler login)
name = "stall-party"
main = "workers/watch.ts"
compatibility_date = "2025-09-18"
workers_dev = false

[[routes]]
pattern = "stall.party"
custom_domain = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Crawl files and /watch-ws must hit the Worker. If assets run first, /watch-ws
# becomes the SPA HTML and spectators sit on "Reconnecting".
run_worker_first = true

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "WatchRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["WatchRoom"]
